name: Rust catalog and client management migration
on:
  push:
    branches:
      - migration/07-catalog-clients
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migration-07-catalog-clients
  cancel-in-progress: true
jobs:
  native-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile actual catalog and client production Rust
        run: cargo test --manifest-path tests/rust-migration/catalog-clients/Cargo.toml

  ts-rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install original TypeScript oracle dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Compare original TS against compiled catalog and client Rust
        run: node --test tests/rust-migration/catalog-clients/parity.test.mjs
      - name: Verify brand aliases evidence URL and historical reference parity
        run: node --test tests/rust-migration/catalog-clients/brand-parity.test.mjs
      - name: Verify category tree mutations and product reassignment parity
        run: node --test tests/rust-migration/catalog-clients/category-parity.test.mjs
      - name: Compare complete client workbook row previews with original TS
        run: node --test tests/rust-migration/catalog-clients/client-preview-parity.test.mjs
      - name: Compare product registration previews with original XLSX TS
        run: node --test tests/rust-migration/catalog-clients/registration-preview-parity.test.mjs
      - name: Compare final product registration batch audits and historical snapshots
        run: node --test tests/rust-migration/catalog-clients/registration-commit-parity.test.mjs
      - name: Compare native official-site import with original TS approval and price preservation
        run: node --test tests/rust-migration/catalog-clients/official-import-parity.test.mjs
      - name: Compare complete original TS product and price Excel previews
        run: node --test tests/rust-migration/catalog-clients/product-sync-preview-parity.test.mjs
      - name: Compare unified single-row product Excel previews with original TS
        run: node --test tests/rust-migration/catalog-clients/unified-product-preview-parity.test.mjs

  frontend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify TypeScript and production bundle
        run: npm run build
      - name: Existing product/client regression suite
        run: npm test

  integrated-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Compile real Tauri and test native management code
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib business_core::catalog_clients::tests
