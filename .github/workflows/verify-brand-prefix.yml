name: Verify legacy brand prefix removal (isolated)
on:
  push:
    branches:
      - test/remove-legacy-brand-prefix-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: TypeScript type check
        run: npm run check:types
      - name: Full Node regression
        run: npm test
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Product management real click test
        run: node scripts/product-name-ui-smoke.mjs
  windows-rust:
    runs-on: windows-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify SQLite original branded names migrate safely
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
