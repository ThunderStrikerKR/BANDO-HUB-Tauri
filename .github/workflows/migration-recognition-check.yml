name: Verify independent Rust recognition handoff
on:
  push:
    branches:
      - migration/03-integration
    paths:
      - .github/workflows/migration-recognition-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recognition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/01-recognition
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile independent recognition source and run 20-order checks
        run: cargo test --manifest-path tests/rust-migration/recognition/Cargo.toml -- --nocapture
