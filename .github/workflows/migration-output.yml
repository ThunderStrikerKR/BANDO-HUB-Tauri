name: Rust output migration isolation
on:
  push:
    branches:
      - migration/03-integration
      - migration/26-p1-p2-runtime-closure
      - migration/05-factory-reply
      - integration/06-history-settlement
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-output-migration03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  output-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run independent Rust output tests
        run: cargo test --manifest-path tests/rust-migration/output/Cargo.toml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify TypeScript and production bundle
        run: npm run build
      - name: Inspect frontend source maps and residual business-core markers
        run: node tests/rust-migration/output/audit-bundle.mjs
      - name: Existing frontend regressions
        run: npm test
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Compile actual Tauri Rust and SQLite tests on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  windows-p1p2-real-exe:
    if: github.ref_name == 'migration/26-p1-p2-runtime-closure'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend build dependencies
        run: npm install --no-audit --no-fund
      - name: Build exact HEAD as native Windows Tauri EXE
        run: npm run build:windows
      - name: Stage exact Windows binary and record SHA256
        shell: pwsh
        run: |
          $dir="src-tauri/target/release"
          $original=Join-Path $dir "bando_hub_tauri.exe"
          if(!(Test-Path $original)){throw "Native EXE was not built"}
          Copy-Item $original (Join-Path $dir "bando_hub.exe")
          Get-FileHash (Join-Path $dir "bando_hub.exe") -Algorithm SHA256
      - name: Install WebView2 inspection client (not browser emulator)
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.1
      - name: Enable loopback WebView2 inspection only for this disposable CI machine
        shell: pwsh
        run: |
          $path="HKCU:\\Software\\Policies\\Microsoft\\Edge\\WebView2\\AdditionalBrowserArguments"
          New-Item -Path $path -Force | Out-Null
          New-ItemProperty -Path $path -Name "bando_hub.exe" -Value "--remote-debugging-port=19651 --remote-debugging-address=127.0.0.1" -PropertyType String -Force | Out-Null
      - name: Boot real EXE, test isolated SQLite and native UI with actual Rust IPC
        env:
          BANDO_NATIVE_EXE: ${{ github.workspace }}\\src-tauri\\target\\release\\bando_hub.exe
          BANDO_NATIVE_OUT: native-p1p2-evidence
          BANDO_NATIVE_BIN_COMMIT: ${{ github.sha }}
        run: node scripts/migration03-reception-native-ui.mjs
      - name: Remove temporary WebView2 inspection policy
        if: always()
        shell: pwsh
        run: |
          $path="HKCU:\\Software\\Policies\\Microsoft\\Edge\\WebView2\\AdditionalBrowserArguments"
          Remove-ItemProperty -Path $path -Name "bando_hub.exe" -ErrorAction SilentlyContinue
      - name: Preserve real EXE screenshot, native IPC and SQLite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1P2-real-Windows-Tauri-EXE-evidence
          path: native-p1p2-evidence/
          if-no-files-found: warn
          retention-days: 7

  output-ts-rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install TypeScript oracle dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Compare TypeScript oracle with real Rust engine
        run: node --test tests/rust-migration/output/parity.test.mjs
      - name: Compare real customer-facing payment text with Rust
        run: node --test tests/rust-migration/output/payment-parity.test.mjs
      - name: Compare original automatic inquiry phase with Rust
        run: node --test tests/rust-migration/output/automatic-request-parity.test.mjs
      - name: Compare full automatic messages and legacy payment copy signatures
        run: node --test tests/rust-migration/output/full-automatic-parity.test.mjs
      - name: Compare existing TypeScript price and freight with staged Rust rules
        run: node --test tests/rust-migration/rules/parity.test.mjs

  order-save-ts-rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install original TypeScript oracle
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify actual native save-order state transitions against TypeScript
        run: node --test tests/rust-migration/rules/order-save-parity.test.mjs
      - name: Compare native group shipping rates with original TypeScript
        run: node --test tests/rust-migration/rules/shipping-rate-parity.test.mjs
      - name: Compare live native staff review with original TypeScript order issues
        run: node --test tests/rust-migration/rules/preview-issues-parity.test.mjs

  rules-comprehensive-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install TypeScript oracle dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Compare full latest TypeScript rules against actual compiled Rust
        run: npx tsx tests/rust-migration/rules/parity/compare.mts

  integrated-rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute actual three-domain Rust dispatcher tests
        run: cargo test --manifest-path tests/rust-migration/integration/Cargo.toml -- --nocapture

  react-native-reception:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install TypeScript dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Real native Rust recognition to React draft parity and preservation
        run: node --test tests/rust-migration/recognition/react-reception.test.mjs

  factory-reply-ts-rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install original TypeScript oracle dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Compare original Excel parser and matching to compiled Rust
        run: node --test tests/rust-migration/factory-reply/parity.test.mjs
      - name: Verify existing manual and automatic Logen XLSX scenarios
        run: node --test tests/tauri-factory-reply-import.test.mjs tests/tauri-factory-reply-auto.test.mjs

  factory-reply-native-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Exercise factory reply parser, automatic SQLite commit and conflict approval on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib factory_ -- --test-threads=1

  history-ts-rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install original TypeScript history oracle
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Compare original TS order history and settlement to compiled Rust
        run: node --test tests/rust-migration/rules/history-parity.test.mjs
