name: Kakao Win32 native regression

on:
  push:
    branches:
      - fix/03-kakao-native-ci-20261113

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows Win32 synthetic Kakao and complete native library
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify Win32 synthetic Kakao tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib kakao_dock::native::tests:: -- --nocapture --test-threads=1
      - name: Verify entire production Tauri Rust library
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
